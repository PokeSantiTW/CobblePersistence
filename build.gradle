plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
	id "org.jetbrains.kotlin.jvm" version "2.1.0"
}

repositories {
	maven { url = "https://maven.impactdev.net/repository/development/" }
}

loom {
	accessWidenerPath = file("src/main/resources/cobblepersistence.accesswidener")
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "com.cobblemon:fabric:${project.cobblemon_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// --- MONGODB (Driver Reactivo + Core + BSON) ---
	implementation "org.mongodb:mongodb-driver-reactivestreams:5.1.4"
	implementation "org.mongodb:mongodb-driver-core:5.1.4"
	implementation "org.mongodb:bson:5.1.4"

	include "org.mongodb:mongodb-driver-reactivestreams:5.1.4"
	include "org.mongodb:mongodb-driver-core:5.1.4"
	include "org.mongodb:bson:5.1.4"

	// --- PROJECT REACTOR ---
	implementation "io.projectreactor:reactor-core:3.6.10"
	include "io.projectreactor:reactor-core:3.6.10"

	// --- REACTIVE STREAMS SPEC ---
	implementation "org.reactivestreams:reactive-streams:1.0.4"
	include "org.reactivestreams:reactive-streams:1.0.4"

	// --- REDIS (Lettuce Core) ---
	implementation "io.lettuce:lettuce-core:6.5.0.RELEASE"
	include "io.lettuce:lettuce-core:6.5.0.RELEASE"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
